c# Local development services. App processes run via PM2 (see ecosystem.config.js);
# this file provides the stateful backing services only.
services:
  db:
    image: postgres:16-alpine
    container_name: lms-db
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lms_pgdata:
